services:
  sqldb:
    image: mysql:8.3
    restart: unless-stopped
    command: --default-storage-engine=innodb
    environment:
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimaiuser
      MYSQL_PASSWORD: kimaipassword
      MYSQL_ROOT_PASSWORD: changemeplease
    volumes:
      - kimai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin -uroot -p$$MYSQL_ROOT_PASSWORD ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kimai:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        BASE: apache
        KIMAI: local
    image: kimai-local:latest
    restart: unless-stopped
    depends_on:
      sqldb:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      APP_ENV: prod
      APP_SECRET: change-this-to-a-long-random-secret
      TRUSTED_HOSTS: localhost|127.0.0.1
      ADMINMAIL: admin@example.com
      ADMINPASS: admin123456
      DATABASE_URL: mysql://kimaiuser:kimaipassword@sqldb/kimai?charset=utf8mb4&serverVersion=8.3.0
    volumes:
      - kimai_data:/opt/kimai/var/data
      - ./var/plugins:/opt/kimai/var/plugins
    command:
      - sh
      - -lc
      - |
        (
          while true; do
            echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] Starting Jira project sync";
            su -s /bin/sh www-data -c '/opt/kimai/bin/console kimai:bundle:kimaijirasync:sync-tasks --user=2' || true;
            echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] Jira project sync finished, sleeping 900s";
            sleep 900;
          done
        ) &
        export APACHE_RUN_USER=www-data
        export APACHE_RUN_GROUP=www-data
        export APACHE_PID_FILE=/var/run/apache2/apache2.pid
        export APACHE_RUN_DIR=/var/run/apache2
        export APACHE_LOCK_DIR=/var/lock/apache2
        export APACHE_LOG_DIR=/var/log/apache2
        export LANG=C
        mkdir -p /var/run/apache2 /var/lock/apache2 /var/log/apache2
        exec /usr/sbin/apache2 -D FOREGROUND

volumes:
  kimai_mysql:
  kimai_data:
